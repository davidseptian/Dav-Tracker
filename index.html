<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dav. Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: personal command center — tegas, ringkas, fokus kerja
   IDEA: stopwatch emas di meja kerja hitam; semua angka berasal dari jam itu
   PICTURE: jam fokus besar di layar pertama, lalu daftar kerja hari ini
   COLOUR and TYPE: hitam pekat + emas Hypospot, Plus Jakarta Sans, angka tabular
   LAYOUT: tab Hari ini / Project / Goals / Dashboard, kolom stack di bawah 760px */
:root{color-scheme:light dark;
--bg:light-dark(#f7f5ef,#0a0a0b);--pn:light-dark(#ffffff,#141416);--pn2:light-dark(#f1ede3,#1b1b1e);
--ln:light-dark(#e3ddcf,#2a2823);--ink:light-dark(#151412,#f2ede2);--mu:light-dark(#6b6556,#a29b8a);
--gd:light-dark(#9c7622,#d2ab4e);--gd2:light-dark(#c9a24a,#ecd59a);--on:light-dark(#fff,#0a0a0b);
--red:light-dark(#b8402c,#ef7a62);--amb:light-dark(#a8620f,#f0b35a);
--c1:light-dark(#9c7622,#d2ab4e);--c2:light-dark(#d4b263,#f1dfa8);--c3:light-dark(#5f4515,#9a7432);--c4:light-dark(#8f8a7e,#77736b);--c5:light-dark(#3f7b72,#6fb0a4)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gd)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px max(4vw,14px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:36px;height:36px;border-radius:10px;background:#0a0a0b;color:#d2ab4e;display:grid;place-items:center;font-weight:800;border:1px solid #d2ab4e}
.brand b{display:block;font-size:17px;line-height:1.1}.brand small{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;order:3;width:100%}
.tabs a{flex:none;padding:9px 14px;border-radius:999px;text-decoration:none;color:var(--mu);font-weight:600;font-size:15px}
.tabs a[aria-current]{background:var(--ink);color:var(--bg)}
.sync{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mu)}.sync.ok i{background:var(--gd)}.sync.err i{background:var(--red)}
@media(min-width:900px){.tabs{order:0;width:auto}}
main{max-width:1240px;margin:0 auto;padding:22px max(4vw,14px) 60px}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px);font-weight:800}h2{font-size:22px;font-weight:700}h3{font-size:17px;font-weight:700}
.sub{color:var(--mu);margin:6px 0 0}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stack{display:grid;gap:16px}
/* timer */
.clock{background:#0a0a0b;color:#f2ede2;border-radius:22px;padding:clamp(18px,3vw,30px);border:1px solid #3a3122;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center;box-shadow:inset 0 1px 0 #3b3220,0 18px 40px -24px #000}
@media(max-width:760px){.clock{grid-template-columns:minmax(0,1fr)}}
.face{font-size:clamp(54px,11vw,104px);font-weight:800;letter-spacing:-.02em;line-height:1;color:#d2ab4e;font-variant-numeric:tabular-nums}
.face.idle{color:#5a5040}
.clock .lbl{color:#a29b8a;font-size:14px;margin-top:8px}
.clock .now{font-size:20px;font-weight:700;margin-top:10px;color:#f2ede2}
.meter{height:8px;border-radius:9px;background:#2a2823;overflow:hidden;margin-top:14px}.meter b{display:block;height:100%;background:linear-gradient(90deg,#9c7622,#ecd59a);border-radius:9px}
.clock input,.clock select,.clock textarea{background:#17171a;border-color:#3a3529;color:#f2ede2}
.clock .chip{background:#1b1b1e;border-color:#3a3529;color:#ecd59a}
.f{display:grid;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
input,select,textarea{min-height:44px;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--pn2);width:100%}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--ln);background:var(--pn2);font-weight:600;cursor:pointer;flex:none}
.btn.gold{background:#d2ab4e;border-color:#d2ab4e;color:#0a0a0b}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent}.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.big{min-height:54px;font-size:17px;padding:12px 24px}
.btn.danger{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--ln);background:var(--pn2);font-size:14px;cursor:pointer;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:3px;display:inline-block}
.st{flex:none;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--ln);white-space:nowrap}
.st.jalan{border-color:var(--gd);color:var(--gd)}.st.selesai{background:var(--gd);color:var(--on);border-color:var(--gd)}.st.batal{color:var(--red)}.st.tahan{color:var(--amb)}
/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln)}
.list li:first-child{border-top:0}
.chk{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--gd);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--on);margin-top:1px}
.chk.on{background:var(--gd)}.chk.on::after{content:"";width:10px;height:6px;border:solid currentColor;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.grow{flex:1}.done .t{text-decoration:line-through;color:var(--mu)}
.t{font-weight:600}.meta{font-size:13px;color:var(--mu);display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:2px}
.pr{font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--pn2);border:1px solid var(--ln)}
.pr.P1{background:#d2ab4e;color:#0a0a0b;border-color:#d2ab4e}
.late{color:var(--red);font-weight:600}
.x{background:none;border:0;color:var(--mu);cursor:pointer;min-width:36px;min-height:36px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:var(--pn2);color:var(--red)}
.dots{display:flex;gap:4px;margin-top:5px}.dots s{width:12px;height:12px;border-radius:4px;background:var(--pn2);border:1px solid var(--ln)}.dots s.on{background:var(--gd);border-color:var(--gd)}
.empty{color:var(--mu);font-size:15px;padding:12px 0}
details>summary{cursor:pointer;color:var(--gd);font-weight:600;min-height:40px;display:flex;align-items:center}
/* bars */
.bar{height:10px;border-radius:9px;background:var(--pn2);overflow:hidden;border:1px solid var(--ln)}.bar b{display:block;height:100%;background:var(--gd);border-radius:9px}
.pcard{display:grid;gap:10px}
.pcard .top2{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px;color:var(--mu)}.nums b{display:block;color:var(--ink);font-size:17px}
.alert{font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid;display:flex;gap:8px;align-items:flex-start}
.alert.red{border-color:color-mix(in srgb,var(--red) 50%,transparent);color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}
.alert.amb{border-color:color-mix(in srgb,var(--amb) 50%,transparent);color:var(--amb);background:color-mix(in srgb,var(--amb) 8%,transparent)}
.ms{display:grid;gap:4px}.ms button{display:flex;gap:8px;align-items:center;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:14px;min-height:32px}
.ms button .chk{width:20px;height:20px;border-radius:6px}.ms .chk.on::after{width:8px;height:5px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px}
.kpi span{font-size:13px;color:var(--mu)}.kpi b{display:block;font-size:clamp(24px,3vw,30px);font-weight:800;margin-top:2px}.kpi small{color:var(--mu);font-size:13px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr)}}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gd) calc(var(--p)*1%),var(--pn2) 0);position:relative}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--pn)}
.ring b{position:relative;font-size:38px;font-weight:800}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:220px;padding-top:10px;position:relative}
.week .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;position:relative}
.week .col i{display:block;border-radius:4px;min-height:2px}
.week .lab{text-align:center;font-size:12.5px;color:var(--mu);margin-top:6px}
.week .v{font-size:12px;text-align:center;font-weight:700;margin-bottom:2px}
.tgt{position:absolute;left:0;right:0;border-top:1.5px dashed var(--gd);pointer-events:none}
.tgt span{position:absolute;right:0;top:-18px;font-size:12px;color:var(--gd);background:var(--pn);padding:0 4px}
.hrow{display:grid;grid-template-columns:7.5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:14px;padding:5px 0}.hrow .bar{height:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-weight:600;font-size:13px}td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
/* dialog */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:grid;place-items:center;padding:14px}
.ov[hidden]{display:none}
.dlg{background:var(--pn);border:1px solid var(--ln);border-radius:18px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}
.dlg label{display:grid;gap:5px;font-size:14px;color:var(--mu);font-weight:600}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:no-preference){.live .face{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.82}}}
@media(max-width:600px){table{font-size:13px}.stack2 thead{display:none}.stack2 tr{display:grid;padding-block:10px;border-bottom:1px solid var(--ln)}.stack2 td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack2 td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mu)}.hrow{grid-template-columns:5.5em minmax(0,1fr) 4em}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">D</span><div><b>Dav. Tracker</b><small id="dateLine"></small></div></div>
  <nav class="tabs" id="tabs">
    <a href="#hari-ini" data-v="hari-ini">Hari ini</a>
    <a href="#project" data-v="project">Project</a>
    <a href="#goals" data-v="goals">Goals 2027</a>
    <a href="#dashboard" data-v="dashboard">Dashboard</a>
  </nav>
  <button id="sync" class="sync" data-a="openCfg" title="Pengaturan sinkron" style="background:none;border:0;cursor:pointer;min-height:36px;padding:0"><i></i><span>Memuat…</span></button>
</header>
<main id="app"></main>
<div id="ov" class="ov" hidden><div class="dlg" role="dialog" aria-modal="true"><form id="dlgForm" class="f"></form></div></div>
<div id="toast" class="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const mk=d=>dk(d).slice(0,7);
const today=()=>dk(Date.now());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return dk(d)};
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const diff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const fd=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return (+d)+' '+BLN[m-1]+(+y!==new Date().getFullYear()?' '+y:'')};
const fm=m=>{m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;return h?h+'j'+(r?' '+r+'m':''):r+'m'};
const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+'.'+pad(d.getMinutes())};
const CATS=[{k:'hypospot',n:'Hypospot',c:'var(--c1)'},{k:'saas',n:'SaaS',c:'var(--c2)'},{k:'kuliah',n:'Kuliah',c:'var(--c3)'},{k:'belajar',n:'Belajar',c:'var(--c4)'},{k:'pribadi',n:'Pribadi',c:'var(--c5)'}];
const cat=k=>CATS.find(c=>c.k===k)||CATS[4];
const STAT={ide:'Ide',jalan:'Berjalan',tahan:'Ditahan',selesai:'Selesai',batal:'Batal'};
const live=p=>p.st!=='selesai'&&p.st!=='batal';

let S={goals:[],projects:[],tasks:[],habits:{list:[],checks:{}},timer:{active:null},settings:{focusTarget:360},logs:{}};
const BASE=['goals','projects','tasks','habits','timer','settings'];
const body=k=>k==='goals'?{items:S.goals}:k==='projects'?{items:S.projects}:k==='tasks'?{items:S.tasks}:k==='habits'?S.habits:k==='timer'?S.timer:k==='settings'?S.settings:{items:S.logs[k.slice(4)]||[]};
function apply(k,d){
  if(k==='goals')S.goals=d.items||[];else if(k==='projects')S.projects=d.items||[];else if(k==='tasks')S.tasks=d.items||[];
  else if(k==='habits')S.habits={list:d.list||[],checks:d.checks||{}};else if(k==='timer')S.timer={active:d.active||null};
  else if(k==='settings')S.settings=Object.assign({focusTarget:360},d);else if(k.startsWith('log-'))S.logs[k.slice(4)]=d.items||[];
}
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- storage: lokal dulu, lalu sinkron ke Google Sheets (Apps Script) ---------- */
let dirty=false;
const LS='dav-tracker-v1',LSC='dav-tracker-cfg',LSD='dav-tracker-dirty';
let cfg={url:'',token:''},meta={},dKeys=new Set(),pushT=0,pushing=false,pushAgain=false;
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){meta=j.__meta||{};delete j.__meta;S=Object.assign(S,j)}
  cfg=Object.assign(cfg,JSON.parse(localStorage.getItem(LSC)||'{}'));dKeys=new Set(JSON.parse(localStorage.getItem(LSD)||'[]'))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(Object.assign({},S,{__meta:meta})));localStorage.setItem(LSD,JSON.stringify([...dKeys]))}catch(e){}}
function save(...ks){const n=Date.now();for(const k of ks){meta[k]=n;dKeys.add(k)}saveLocal();schedPush(2500)}
function schedPush(ms){if(!cfg.url){setSync('local');return}clearTimeout(pushT);pushT=setTimeout(push,ms)}
async function push(){
  if(!cfg.url||!dKeys.size)return;if(pushing){pushAgain=true;return}pushing=true;setSync('save');
  const keys=[...dKeys],docs={};for(const k of keys)docs[k]={u:meta[k]||Date.now(),d:clone(body(k))};
  try{const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,action:'save',docs})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'gagal');
    for(const k of keys)if(meta[k]===docs[k].u)dKeys.delete(k);saveLocal();setSync('ok')}
  catch(e){setSync('err','Belum tersinkron · '+(e.message==='token salah'?'token salah':'dicoba lagi'));schedPush(30000)}
  pushing=false;if(pushAgain){pushAgain=false;push()}
}
async function pull(){
  if(!cfg.url)return;
  try{const r=await fetch(cfg.url+'?action=load&token='+encodeURIComponent(cfg.token));const j=await r.json();if(!j.ok)throw new Error(j.error||'gagal');
    let ch=false;const rem=j.docs||{};
    for(const k of Object.keys(rem)){if(dKeys.has(k))continue;if(!meta[k]||rem[k].u>meta[k]){apply(k,rem[k].d||{});meta[k]=rem[k].u;ch=true}}
    for(const k of Object.keys(meta))if(!rem[k]||meta[k]>rem[k].u)dKeys.add(k);
    saveLocal();if(dKeys.size)schedPush(500);else setSync('ok');if(ch)softRender()}
  catch(e){setSync('err',e.message==='token salah'?'Token salah, cek Pengaturan':'Tidak terhubung ke Google Sheets')}
}
function softRender(){const a=document.activeElement;if(a&&$('#app').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){dirty=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){dirty=false;render()}},120));
function setSync(st,msg){
  const el=$('#sync');el.className='sync'+(st==='ok'?' ok':st==='err'?' err':'');
  el.lastChild.textContent=st==='ok'?'Tersinkron ke Google Sheets':st==='save'?'Menyimpan…':st==='local'?'Mode lokal · sambungkan Sheets di Dashboard':st==='err'?msg:'Memuat…';
}

/* ---------- hitungan ---------- */
const allLogs=()=>Object.values(S.logs).flat();
const logsOn=d=>allLogs().filter(l=>l.date===d);
const minsOn=d=>logsOn(d).reduce((a,l)=>a+(l.min||0),0);
const pById=id=>S.projects.find(p=>p.id===id);
const gById=id=>S.goals.find(g=>g.id===id);
const prog=p=>{const m=p.ms||[];return m.length?Math.round(m.filter(x=>x.done).length/m.length*100):(+p.prog||0)};
const idle=p=>p.last?Math.max(0,diff(p.last,today())):null;
function alerts(p){
  const a=[],i=idle(p),pr=prog(p),ef=p.eff||0;
  if(p.st==='jalan'&&i!==null&&i>=14)a.push(['red',`Mangkrak ${i} hari, terakhir disentuh ${fd(p.last)}`]);
  else if(p.st==='jalan'&&i!==null&&i>=7)a.push(['amb',`Mulai dingin: ${i} hari tanpa aktivitas`]);
  if(live(p)&&ef>=600&&pr<50)a.push(['red',`Effort ${fm(ef)} tapi progres baru ${pr}%`]);
  if(p.dl&&live(p)&&p.dl<today())a.push(['red',`Lewat deadline ${fd(p.dl)}`]);
  if(p.st==='tahan'&&i!==null&&i>=30)a.push(['amb',`Ditahan ${i} hari, putuskan lanjut atau batal`]);
  if(p.st==='batal'&&ef>=120)a.push(['amb',`Batal setelah effort ${fm(ef)}, catat pelajarannya`]);
  return a;
}
const gProg=g=>{const ps=S.projects.filter(p=>p.goal===g.id&&p.st!=='batal');return ps.length?Math.round(ps.reduce((a,p)=>a+prog(p),0)/ps.length):(+g.prog||0)};
function streak(id){const c=S.habits.checks;let d=today(),n=0;if(!(c[d]||[]).includes(id))d=addDays(d,-1);while((c[d]||[]).includes(id)){n++;d=addDays(d,-1)}return n}
function rates(){
  const t=today(),days=[...Array(7)].map((_,i)=>addDays(t,i-6));
  const tk=S.tasks.filter(x=>x.date&&x.date>=days[0]&&x.date<=t);
  const task=tk.length?Math.round(tk.filter(x=>x.done).length/tk.length*100):null;
  const hl=S.habits.list.length;
  const hab=hl?Math.round(days.reduce((a,d)=>a+(S.habits.checks[d]||[]).filter(id=>S.habits.list.some(h=>h.id===id)).length,0)/(hl*7)*100):null;
  const fm7=days.reduce((a,d)=>a+minsOn(d),0),tg=S.settings.focusTarget||360;
  const focus=Math.min(100,Math.round(fm7/7/tg*100));
  const parts=[task,hab,focus].filter(v=>v!==null);
  return{days,task,hab,focus,fm7,score:parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):0,tkn:tk.length};
}

function editProj(p){
  const isNew=!p;p=p||{id:uid(),st:'jalan',cat:'hypospot',start:today(),last:today(),eff:0,ms:[]};
  modal(isNew?'Project baru':'Edit project',[
    {k:'name',label:'Nama project / system',req:1},{k:'cat',label:'Area',type:'sel',opts:CATS.map(c=>[c.k,c.n])},
    {k:'goal',label:'Mendukung goal',type:'sel',opts:goalOpts()},{k:'st',label:'Status',type:'sel',opts:Object.entries(STAT)},
    {k:'dl',label:'Deadline',type:'date'},{k:'ms',label:'Milestone',hint:'(satu per baris, awali [x] kalau sudah selesai)',type:'area'},
    {k:'prog',label:'Progres manual %',hint:'(dipakai kalau tidak ada milestone)',type:'number'},
    {k:'note',label:'Catatan terakhir',type:'area'},{k:'out',label:'Hasil akhir / pelajaran',type:'area'}],
    Object.assign({},p,{ms:msText(p)}),v=>{

function startTimer(title,c,proj){

function addLog(l){
  const m=l.date.slice(0,7);(S.logs[m]=S.logs[m]||[]).push(l);
  const p=l.proj&&pById(l.proj);if(p){p.eff=(p.eff||0)+l.min;if(!p.last||l.date>p.last)p.last=l.date;if(l.note)p.note=l.note;if(p.st==='ide')p.st='jalan'}
  save('log-'+m,'projects');
}
